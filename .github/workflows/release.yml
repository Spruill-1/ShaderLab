name: Release

# Pushing a tag v<major>.<minor>.<patch> runs CI, builds the MSIX for x64 and
# ARM64 with that version, signs it with Azure Artifact Signing, and publishes a
# GitHub release. Signing waits in the 'release' environment for approval.
#
# Signing is on when the repository variable MSIX_PUBLISHER is set (the
# certificate's subject, which the package's Publisher must equal). It also
# needs AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_SUBSCRIPTION_ID,
# SIGNING_ENDPOINT, SIGNING_ACCOUNT and SIGNING_PROFILE; no secret is stored,
# azure/login trades the job's OIDC token for an Entra token. Without
# MSIX_PUBLISHER the release is unsigned, for Developer Mode installs
# (docs/development/releasing.md).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to commits; the comment names the release.
jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build MSIX (${{ matrix.platform }})
    needs: ci
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Stamp version and publisher
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          $ref = '${{ github.ref_name }}'
          $version = if ($ref -match '^v(\d+)\.(\d+)\.(\d+)$') { "$($Matches[1]).$($Matches[2]).$($Matches[3]).0" } else { '0.0.0.0' }
          # Unsigned packages carry the OID that lets Add-AppxPackage -AllowUnsigned
          # take them; a signed one carries the certificate's subject.
          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER }
                       else { 'CN=ShaderLab, OID.2.25.311729368913984317654407730594956997722=1' }
          [xml]$manifest = Get-Content Package.appxmanifest -Raw
          $manifest.Package.Identity.Version = $version
          $manifest.Package.Identity.Publisher = $publisher
          $manifest.Save((Resolve-Path Package.appxmanifest))
          Write-Host "Version $version, Publisher $publisher"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Setup NuGet
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

      - name: NuGet restore
        run: nuget restore ShaderLab.slnx -SolutionDirectory .

      # ARM64 is cross-compiled; the native-arm64 CI job guards the ARM64-host build.
      - name: Build
        shell: pwsh
        run: |
          msbuild ShaderLab.vcxproj `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=false `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir=$env:GITHUB_WORKSPACE\out\ `
            /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The sideload folder: ShaderLab_<version>_<arch>.msix and Dependencies\.
      - name: Collect the package folder
        shell: pwsh
        run: |
          $msix = Get-ChildItem out -Recurse -Filter 'ShaderLab_*.msix' -File |
                  Where-Object { $_.FullName -notmatch '\\Dependencies\\' }
          if (@($msix).Count -ne 1) { Get-ChildItem out -Recurse | ForEach-Object FullName; throw "Expected one ShaderLab msix, found $(@($msix).Count)" }
          # The hub's exe is a hand-added payload; without it MCP fails only at runtime.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          $hasBroker = $zip.Entries.FullName -contains 'ShaderLabMcpBroker.exe'
          $zip.Dispose()
          if (-not $hasBroker) { throw "$($msix.Name) has no ShaderLabMcpBroker.exe" }
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item -Recurse "$($msix.Directory.FullName)\*" stage
          Copy-Item scripts/Install.ps1 stage
          Get-ChildItem stage -Recurse -File | ForEach-Object { $_.FullName.Substring($PWD.Path.Length + 1) }

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.platform }}
          path: stage
          if-no-files-found: error

  sign:
    name: Sign (Azure Artifact Signing)
    needs: build
    if: vars.MSIX_PUBLISHER != ''
    runs-on: windows-2025
    # Required reviewers on this environment are the approval gate, and the
    # Entra app's federated credential trusts only this environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-*
          path: pkg

      # Only ShaderLab's own package: Dependencies\ holds Microsoft's, already signed.
      - name: List the packages to sign
        id: files
        shell: pwsh
        run: |
          $files = Get-ChildItem pkg -Recurse -Filter 'ShaderLab_*.msix' -File |
                   Where-Object { $_.FullName -notmatch '\\Dependencies\\' } | ForEach-Object FullName
          if (@($files).Count -ne 2) { throw "Expected two ShaderLab msix files, found $(@($files).Count)" }
          "list<<EOF`n$($files -join "`n")`nEOF" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ steps.files.outputs.list }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-azure-cli-credential: false

      - name: Verify
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem pkg -Recurse -Filter 'ShaderLab_*.msix' -File | Where-Object { $_.FullName -notmatch '\\Dependencies\\' }) {
            $sig = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$($file.Name) is not validly signed: $($sig.StatusMessage)" }
            if ($sig.SignerCertificate.Subject -ne '${{ vars.MSIX_PUBLISHER }}') {
              throw "Signer '$($sig.SignerCertificate.Subject)' differs from MSIX_PUBLISHER; the package will not install."
            }
          }

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: pkg
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [build, sign]
    # Signed when signing is configured, unsigned otherwise; only from a tag.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      needs.build.result == 'success' &&
      (needs.sign.result == 'success' || (needs.sign.result == 'skipped' && vars.MSIX_PUBLISHER == ''))
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Download signed
        if: needs.sign.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: pkg

      - name: Download unsigned
        if: needs.sign.result != 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-*
          path: pkg

      - name: Zip each platform
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($dir in Get-ChildItem pkg -Directory) {
            $platform = ($dir.Name -replace '^unsigned-', '').ToLowerInvariant()
            Compress-Archive -Path "$($dir.FullName)\*" -DestinationPath "dist\ShaderLab-$version-$platform.zip"
          }
          Get-ChildItem dist | ForEach-Object Name

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ShaderLab ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
